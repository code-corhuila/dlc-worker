# Migration job of the notifications schema against the platform PostgreSQL. The worker runtime never migrates.
# docker compose --env-file .env -f db/deploy/compose.migrate.yml --profile tooling run --rm notifications-db-migrate update
services:
  notifications-db-migrate:
    image: ${DLC_LIQUIBASE_IMAGE:-liquibase/liquibase:4.33.0}
    profiles: [tooling]
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    secrets:
      - notifications_migrator_password
    environment:
      DLC_ENVIRONMENT: ${DLC_ENVIRONMENT:?Set DLC_ENVIRONMENT to dev, qa or prod}
      DLC_POSTGRES_HOST: ${DLC_POSTGRES_HOST:-dlc-postgres}
      DLC_POSTGRES_DB: ${DLC_POSTGRES_DB:-di_lucca}
    networks: [platform]
    entrypoint: ["/bin/sh", "/workspace/db/deploy/run-migration.sh"]
    command: ["update"]

secrets:
  notifications_migrator_password:
    file: ${NOTIFICATIONS_MIGRATOR_PASSWORD_FILE:?Set the migrator password file of this environment}

networks:
  platform:
    name: ${DLC_PLATFORM_NETWORK:-platform}
    external: true
